<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Never serve a stale shell HTML that points at an old main.dart.js. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ticket_maker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ticket_maker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Load CanvasKit so RepaintBoundary.toImage works for ticket PNG download.
    Event photos are fetched as bytes → MemoryImage in Dart to avoid
    CORS-tainted canvases from cross-origin HTML <img> elements.
    See: https://docs.flutter.dev/platform-integration/web/initialization

    __TICKETMAKER_BUILD_ID__ is rewritten by scripts/build_web.sh /
    scripts/patch_web_bootstrap.sh so browsers fetch a fresh main.dart.js.
  -->
  <script>
    window.__TICKETMAKER_BUILD_ID__ = "{{TICKETMAKER_BUILD_ID}}";
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        renderer: "canvaskit"
      }
    });
  </script>
</body>
</html>
