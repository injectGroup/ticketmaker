name: Notify app update

on:
  push:
    branches:
      - main

jobs:
  google-chat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post update to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CHAT_WEBHOOK_URL:-}" ]; then
            echo "GOOGLE_CHAT_WEBHOOK_URL secret is not set; skipping Chat notify."
            exit 0
          fi
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | tr '\n' ' ' | cut -c1-200)
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
          TEXT="ticketmaker: App update on main — ${SUBJECT} (${SHORT_SHA}) by ${ACTOR} — https://github.com/${REPO}/commit/${COMMIT_SHA}"
          export TEXT
          python3 <<'PY'
          import json, os, urllib.request
          text = os.environ["TEXT"]
          body = json.dumps({"text": text}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["GOOGLE_CHAT_WEBHOOK_URL"],
              data=body,
              headers={"Content-Type": "application/json; charset=UTF-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("Google Chat status:", resp.status)
          PY
