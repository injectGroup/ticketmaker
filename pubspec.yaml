name: ticket_maker
description: Quick Ticket Maker — generate styled event tickets with customizable QR codes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  mobile_scanner: ^7.1.3
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  path_provider: ^2.1.6
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  image: ^4.8.0
  web: ^1.1.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/ticket_event_placeholder.png
    - assets/images/app_logo_mark.png
    # Pre-bundled Google Fonts. google_fonts resolves these from the asset
    # manifest by `<Family>-<Variant>` filename, so no runtime fetch from
    # fonts.gstatic.com is needed and web text never renders in a fallback
    # font while a download is in flight (the source of the
    # "Could not find a set of Noto fonts" console warning).
    # Only the variants the app actually requests are bundled — see
    # test/bundled_fonts_test.dart, which fails if a new variant is missing.
    - assets/fonts/
