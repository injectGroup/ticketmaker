name: ticket_maker
description: Quick Ticket Maker — generate styled event tickets with customizable QR codes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  path_provider: ^2.1.6
  geolocator: ^14.0.2
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ticket_event_placeholder.png
